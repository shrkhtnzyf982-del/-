<script async src="https://www.googletagmanager.com/gtag/js?id=G-PLACEHOLDER000"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-PLACEHOLDER000');
</script>
<script>
(function(){
  function send(name, params){
    try{ if(typeof gtag==='function'){ gtag('event', name, params||{}); } }catch(e){}
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest('a');
    if(!a || !a.href) return;
    var h = a.href;
    if(h.indexOf('wa.me')>-1 || h.indexOf('whatsapp')>-1){
      send('whatsapp_click', {event_category:'contact', event_label: h.slice(0,120)});
    } else if(h.indexOf('tel:')===0){
      send('phone_call', {event_category:'contact', event_label: h});
    }
  }, true);
})();
</script>

<script>
(function(){
  function enhanceServices(){
    var section = document.getElementById('services') || document.querySelector('.services-section') || document.querySelector('section.services');
    if(!section) return;
    var grid = section.querySelector('.services-grid') || section.querySelector('.grid') || section.querySelector('[class*="service"]');
    if(!grid || grid.dataset.marquee==='1') return;
    var cards = grid.children;
    if(cards.length < 3) return;
    var wrap = document.createElement('div');
    wrap.className = 'services-auto-wrap';
    var track = document.createElement('div');
    track.className = 'services-auto-track';
    // clone children twice for seamless loop
    var html = grid.innerHTML;
    track.innerHTML = html + html;
    wrap.appendChild(track);
    grid.parentNode.insertBefore(wrap, grid);
    grid.style.display = 'none';
    grid.dataset.marquee = '1';
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', enhanceServices);
  else enhanceServices();
})();
</script>
